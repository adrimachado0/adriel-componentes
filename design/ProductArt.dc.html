<sc-if value="{{is.psu}}" hint-placeholder-val="{{ false }}">
<svg width="{{w}}" height="{{h}}" viewBox="0 0 120 80" fill="none" stroke="{{accent}}" stroke-width="{{sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="60" cy="73" rx="44" ry="3" fill="{{accent}}" fill-opacity="{{shadow}}" stroke="none"></ellipse><rect x="18" y="14" width="84" height="52" rx="5" fill="#FFFFFF"></rect><circle cx="50" cy="40" r="18" fill="{{accent}}" fill-opacity="0.08"></circle><circle cx="50" cy="40" r="4" fill="{{accent}}" fill-opacity="0.35"></circle><path d="M50 22v14M50 44v14M32 40h14M54 40h14"></path><rect x="80" y="22" width="14" height="10" rx="1.5" fill="{{accent}}" fill-opacity="0.14"></rect><rect x="84" y="46" width="6" height="10" rx="1"></rect></svg>

</sc-if>
<sc-if value="{{is.hdd}}" hint-placeholder-val="{{ false }}">
<svg width="{{w}}" height="{{h}}" viewBox="0 0 120 80" fill="none" stroke="{{accent}}" stroke-width="{{sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="60" cy="77" rx="32" ry="2.5" fill="{{accent}}" fill-opacity="{{shadow}}" stroke="none"></ellipse><rect x="30" y="8" width="60" height="64" rx="5" fill="#FFFFFF"></rect><circle cx="60" cy="34" r="18" fill="{{accent}}" fill-opacity="0.1"></circle><circle cx="60" cy="34" r="3" fill="{{accent}}" fill-opacity="0.35"></circle><path d="M80 62L66 42"></path><circle cx="80" cy="62" r="2.5"></circle></svg>

<svg width="{{w}}" height="{{h}}" viewBox="0 0 120 80" fill="none" stroke="{{accent}}" stroke-width="{{sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="60" cy="73" rx="32" ry="2.5" fill="{{accent}}" fill-opacity="{{shadow}}" stroke="none"></ellipse><rect x="32" y="10" width="56" height="56" rx="9" fill="#FFFFFF"></rect><circle cx="60" cy="38" r="21" fill="{{accent}}" fill-opacity="0.08"></circle><circle cx="60" cy="38" r="5" fill="{{accent}}" fill-opacity="0.35"></circle><path d="M60 33c0-7 5-12 12-11M65 38c7 0 12 5 11 12M60 43c0 7-5 12-12 11M55 38c-7 0-12-5-11-12"></path></svg>

<sc-if value="{{is.generic}}" hint-placeholder-val="{{ false }}">
<svg width="{{gw}}" height="{{gw}}" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" fill="#FFFFFF"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"gpu","options":["gpu","ram","ssd","cpu","psu","mobo","hdd","cooler","generico"]},"accent":{"editor":"color","default":"#1F5BEF"},"size":{"editor":"enum","default":"md","options":["sm","ms","md","ml","lg"]},"$preview":{"width":240,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1F5BEF';
    const kind = this.props.kind ?? 'gpu';
    const known = ['ram', 'gpu', 'ssd', 'cpu', 'psu', 'mobo', 'hdd', 'cooler'];
    const is = {};
    is[known.indexOf(kind) >= 0 ? kind : 'generic'] = true;
    const size = this.props.size ?? 'md';
    const dims = { sm: [62, 41, 3, 30], ms: [118, 79, 2.2, 52], md: [170, 113, 1.8, 72], ml: [250, 167, 1.6, 96], lg: [360, 240, 1.4, 128] }[size] || [170, 113, 1.8, 72];
    return { accent: accent, is: is, w: dims[0], h: dims[1], sw: dims[2], gw: dims[3], shadow: size === 'sm' ? 0 : 0.1 };
  }
}
</script>
</body>
</html>
